<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LostTracker</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a30;
    --panel-2: #182142;
    --line: #23305c;
    --text: #e6ebff;
    --muted: #8e9ac4;
    --gold: #e8b84b;
    --teal: #3fd0c9;
    --danger: #ef6a6a;
    --done: #2c3a5f;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
  .brand span { color: var(--gold); }
  nav { display: flex; gap: 3px; }
  nav button {
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: 6px 13px; border-radius: var(--radius); cursor: pointer; font: inherit;
  }
  nav button:hover { color: var(--text); background: var(--panel-2); }
  nav button[aria-selected="true"] { color: var(--text); background: var(--panel-2); border-color: var(--line); }
  .spacer { flex: 1; }
  .account { font-size: 13px; color: var(--muted); }

  main { padding: 16px; max-width: 1600px; margin: 0 auto; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 16px;
  }
  .panel > h2 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted);
  }

  button.btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  button.btn:hover { border-color: var(--teal); }
  button.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.btn.primary { background: var(--teal); border-color: var(--teal); color: #04212a; font-weight: 600; }

  input[type="text"], input[type="number"], input[type="password"], select {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 9px; font: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

  /* ---- checklist grid ---- */
  .grid-wrap { overflow-x: auto; border-radius: 6px; }
  table.grid { border-collapse: collapse; width: 100%; background: #0f1119; }
  table.grid th, table.grid td { border: 1px solid #262b3d; padding: 0; }

  th.task-col {
    text-align: left; font-weight: 400; white-space: nowrap; font-size: 13px;
    position: sticky; left: 0; background: #171a26; z-index: 2;
    min-width: 210px; padding: 7px 10px; color: #d6dae8;
  }
  th.task-col img { width: 17px; height: 17px; vertical-align: -4px; margin-right: 8px; }
  th.task-col { cursor: grab; }
  th.task-col:active { cursor: grabbing; }
  .grip { color: #3f4763; margin-right: 7px; font-size: 12px; letter-spacing: -1px; }
  th.task-col:hover .grip { color: var(--teal); }
  tr.dragging { opacity: .4; }
  /* The insertion line shows which side of the hovered row the drop lands on. */
  th.task-col.drop-above { box-shadow: inset 0 2px 0 0 var(--teal); }
  th.task-col.drop-below { box-shadow: inset 0 -2px 0 0 var(--teal); }

  thead th.char-col {
    background: #1b2233; font-size: 12px; white-space: nowrap; font-weight: 600;
    padding: 8px 10px; min-width: 108px; text-align: center; color: #e8ecf7;
  }
  thead th.char-col img { width: 20px; height: 20px; vertical-align: -5px; margin-right: 5px; opacity: .85; }
  thead th.char-col .ilvl { color: #aab3c9; font-weight: 400; }
  thead th.char-col .gold-flag { color: var(--gold); }

  /* Section bands run the full width with the label centred, matching the
     source layout rather than a left-aligned caption. */
  tr.section th {
    background: #05070d; text-align: center; color: #e8ecf7;
    font-size: 12px; font-weight: 600; padding: 6px 10px; letter-spacing: .2px;
  }
  tr.section .eye {
    display: inline-block; width: 26px; height: 13px; border-radius: 7px;
    background: #2f7fd0; position: relative; vertical-align: -2px; margin-right: 8px;
  }
  tr.section .eye::after {
    content: ""; position: absolute; right: 2px; top: 2px;
    width: 9px; height: 9px; border-radius: 50%; background: #dfe7f5;
    transition: all .12s;
  }
  tr.section .eye.off { background: #39405a; }
  tr.section .eye.off::after { right: 15px; }
  tr.section th[data-section] { cursor: pointer; user-select: none; }
  tr.section th[data-section]:hover { background: #0c1018; }

  /* Row tints per section, as in the source: dailies dark, weeklies purple. */
  tr.tint-weekly td { background: #241f33; }
  tr.tint-weekly th.task-col { background: #201b2c; }

  td.cell-td { text-align: center; padding: 4px 6px; position: relative; }
  .cell {
    border: 0; background: #2f7fd0; color: #fff; border-radius: 3px;
    font: 600 12px/1 inherit; padding: 5px 12px; cursor: pointer;
    display: inline-block; min-width: 46px;
  }
  .cell:hover { filter: brightness(1.15); }
  .cell.complete { background: transparent; color: #8f97ad; font-weight: 500; }
  .cell .coin { margin-right: 5px; }
  /* The carry marker sits to the right of a finished counter, as in the source. */
  .carry { position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
           color: #6d768f; font-size: 11px; font-weight: 600; pointer-events: none; }

  /* A finished cell is shaded rather than coloured-in, so the blue pills read
     as "still to do" at a glance across a wide roster. */
  tr:not(.tint-weekly) td.cell-td.done { background: #172b1d; }
  tr.tint-weekly td.cell-td.done { background: #2b2540; }

  td.na { background: #0c0e16; }
  td.na span { display: block; text-align: center; color: #333a4f; padding: 8px 4px; }

  /* Roster-scope rows are one bar across every character column. */
  td.roster-td { padding: 5px 8px; }
  .cell.roster {
    display: block; width: 100%; min-width: 0; text-align: center; border-radius: 3px;
  }
  .cell.roster.complete { background: #2b3040; color: #99a1b6; }

  /* ---- dashboard / history ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; }
  .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .card .value { font-size: 25px; font-weight: 700; margin-top: 3px; }
  .card .value.gold { color: var(--gold); }
  .card .value.teal { color: var(--teal); }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar { height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--teal); }
  .bar.gold > i { background: var(--gold); }

  table.plain { width: 100%; border-collapse: collapse; }
  table.plain th, table.plain td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  table.plain th { color: var(--muted); font-size: 12px; font-weight: 500; }
  table.plain td.num, table.plain th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* The bar sits in its own track so its percentage height resolves against a
     definite box. Sharing a box with the label let the label steal space and
     flex-shrink squashed tall bars to the same height. */
  .chart { display: flex; align-items: stretch; gap: 5px; height: 130px; padding-top: 8px; }
  .chart .col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chart .track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .chart .col i { display: block; width: 100%; background: var(--gold); border-radius: 3px 3px 0 0; min-height: 2px; flex: 0 0 auto; }
  .chart .col small { color: var(--muted); font-size: 10px; white-space: nowrap; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 110px; }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  /* per-character task chooser */
  details.char-tasks { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; background: var(--bg); }
  details.char-tasks > summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-size: 13px; }
  details.char-tasks > summary:hover { color: var(--text); }
  details.char-tasks[open] > summary { border-bottom: 1px solid var(--line); }
  details.char-tasks > *:not(summary) { margin: 10px 12px; }
  .task-group h3 {
    margin: 12px 0 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--gold); font-weight: 600;
  }
  .task-group { display: block; }
  label.task-pick {
    display: inline-flex; align-items: center; gap: 6px; width: 250px;
    padding: 3px 0; color: var(--text); font-size: 13px; cursor: pointer;
  }
  label.task-pick img { width: 16px; height: 16px; }

  .toast {
    position: fixed; bottom: 16px; right: 16px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>

<script>
"use strict";

/* ============================================================
   LostTracker — single-user Lost Ark checklist.

   All tracker data lives in the Worker's D1 database; the only
   things kept in this browser are the API URL and key.
   ============================================================ */

const LS_API = "losttracker.api";
const LS_KEY = "losttracker.key";
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const ROSTER = "@roster";        // stand-in character id for roster-scope tasks
const HISTORY_LIMIT = 26;        // half a year of weeks

let state = null;
let activeTab = "checklist";
let saveTimer = null;
let syncStatus = "idle";
// Which character task-pickers are expanded. View state only, so it is kept out
// of the saved document and re-applied after each re-render.
const openCharPanels = new Set();

/* ---------- utilities ---------- */

const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// localStorage throws on an opaque origin (file://, private windows), so every
// access is guarded and falls back to memory.
const memory = new Map();
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return memory.get(k) ?? null; } },
  set(k, v) { memory.set(k, v); try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { memory.delete(k); try { localStorage.removeItem(k); } catch (e) {} },
};

const apiBase = () => (store.get(LS_API) || "").replace(/\/+$/, "");
const apiKey = () => store.get(LS_KEY) || "";
const configured = () => !!apiBase() && !!apiKey();

function api(path, options) {
  return fetch(apiBase() + path, {
    ...options,
    headers: { "X-LostTracker-Key": apiKey(), ...((options && options.headers) || {}) },
  });
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function defaultState() {
  return {
    version: 2,
    characters: [],
    tasks: [],
    // Keyed "taskId:characterId"; roster-scope tasks use the ROSTER stand-in.
    progress: {},
    // Per-character opt-outs: { characterId: { taskId: false } }. Only
    // exclusions are stored, so a newly added task is on everywhere by default
    // and a newly imported character inherits the full eligible set.
    charTasks: {},
    seeded: false,
    // Collapsed checklist sections, keyed "freq|scope".
    collapsed: {},
    resetHour: 6,
    resetDay: 3,          // Wednesday
    lastDaily: 0,
    lastWeekly: 0,
    history: [],          // [{ end: epochSeconds, gold: number }]
    bibleName: "",
    bibleRegion: "CE",
  };
}

/* ---------- reset scheduling ---------- */

function lastDailyBoundary(hour) {
  const now = new Date();
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, 0, 0, 0);
  if (b > now) b.setDate(b.getDate() - 1);
  return b.getTime();
}

function lastWeeklyBoundary(day, hour) {
  const now = new Date();
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, 0, 0, 0);
  for (let i = 0; i < 14 && (b.getDay() !== day || b > now); i++) b.setDate(b.getDate() - 1);
  return b.getTime();
}

function nextBoundary(kind) {
  const d = new Date(kind === "daily"
    ? lastDailyBoundary(state.resetHour)
    : lastWeeklyBoundary(state.resetDay, state.resetHour));
  d.setDate(d.getDate() + (kind === "daily" ? 1 : 7));
  return d;
}

function untilText(date) {
  let mins = Math.max(0, Math.round((date - Date.now()) / 60000));
  const days = Math.floor(mins / 1440); mins -= days * 1440;
  const hours = Math.floor(mins / 60); mins -= hours * 60;
  if (days) return days + "d " + hours + "h";
  if (hours) return hours + "h " + mins + "m";
  return mins + "m";
}

// Clears whatever has passed its boundary. The week's gold is banked into
// history before the weekly wipe, which is what makes the History tab possible.
function applyResets() {
  let changed = false;
  const daily = lastDailyBoundary(state.resetHour);
  const weekly = lastWeeklyBoundary(state.resetDay, state.resetHour);

  if (state.lastDaily < daily) {
    clearFreq("daily");
    state.lastDaily = daily;
    changed = true;
  }
  if (state.lastWeekly < weekly) {
    const earned = goldTotals().earned;
    if (earned > 0 || state.history.length) {
      state.history.push({ end: Math.floor(weekly / 1000), gold: earned });
      if (state.history.length > HISTORY_LIMIT) state.history = state.history.slice(-HISTORY_LIMIT);
    }
    clearFreq("weekly");
    clearFreq("biweekly");
    state.lastWeekly = weekly;
    changed = true;
  }
  return changed;
}

function clearFreq(freq) {
  const ids = new Set(state.tasks.filter((t) => t.freq === freq).map((t) => t.id));
  for (const key of Object.keys(state.progress)) {
    if (ids.has(key.split(":")[0])) delete state.progress[key];
  }
}

/* ---------- derived numbers ---------- */

const goldChars = () => state.characters.filter((c) => c.countsGold);
const progressOf = (taskId, charId) => state.progress[taskId + ":" + charId] || 0;

// A task only applies to a character inside its item-level window.
function applies(task, ch) {
  const ilvl = Number(ch.ilvl) || 0;
  return ilvl >= (task.min || 0) && ilvl <= (task.max || 9999);
}

// Tracked = shown at all. Untracked tasks stay in the list so they can be
// switched back on without losing their gold value.
const isTracked = (t) => t.tracked !== false;

// Whether this character actually runs this task: tracked, within its level
// window, and not switched off for this character specifically.
function enabledFor(task, ch) {
  if (!isTracked(task) || !applies(task, ch)) return false;
  const overrides = state.charTasks[ch.id];
  return !(overrides && overrides[task.id] === false);
}

function setCharTask(charId, taskId, on) {
  if (on) {
    if (state.charTasks[charId]) delete state.charTasks[charId][taskId];
  } else {
    if (!state.charTasks[charId]) state.charTasks[charId] = {};
    state.charTasks[charId][taskId] = false;
  }
}

function goldTotals() {
  let earned = 0;
  let potential = 0;
  for (const t of state.tasks) {
    const gold = Number(t.gold) || 0;
    if (!gold || !isTracked(t)) continue;
    if (t.scope === "roster") {
      earned += gold * progressOf(t.id, ROSTER);
      potential += gold * t.reps;
      continue;
    }
    for (const ch of goldChars()) {
      if (!enabledFor(t, ch)) continue;
      earned += gold * progressOf(t.id, ch.id);
      potential += gold * t.reps;
    }
  }
  return { earned, potential };
}

function completion() {
  let done = 0;
  let total = 0;
  for (const t of state.tasks) {
    if (!isTracked(t)) continue;
    if (t.scope === "roster") {
      total += t.reps;
      done += Math.min(progressOf(t.id, ROSTER), t.reps);
      continue;
    }
    for (const ch of state.characters) {
      if (!enabledFor(t, ch)) continue;
      total += t.reps;
      done += Math.min(progressOf(t.id, ch.id), t.reps);
    }
  }
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

/* ---------- persistence ---------- */

async function loadState() {
  state = defaultState();
  if (!configured()) { syncStatus = "unconfigured"; return; }

  try {
    const res = await api("/api/state");
    if (res.status === 401) { syncStatus = "error"; toast("The API rejected that key"); return; }
    if (!res.ok) { syncStatus = "error"; toast("Could not load (" + res.status + ")"); return; }
    const body = await res.json();
    state = migrate({ ...defaultState(), ...(body.data || {}) });
    syncStatus = "saved";
  } catch (err) {
    syncStatus = "error";
    toast("Could not reach the API");
  }
}

// v1 kept separate dailyTasks/weeklyTasks/raids arrays and boolean progress.
// Characters are worth carrying across; the rest is rebuilt from the catalogue.
// Scope is derived from the catalogue rather than stored opinion, so a change
// to the raid/non-raid rule reaches state that was saved under the old one.
function normaliseScopes(s) {
  for (const t of s.tasks || []) {
    const ref = TASK_CATALOGUE.find((c) => c.name === t.name);
    if (!ref) continue;
    if (t.scope !== ref.scope) {
      // Progress was keyed by the old scope, so drop this task's counters
      // rather than leave them stranded under keys nothing reads.
      for (const key of Object.keys(s.progress || {})) {
        if (key.startsWith(t.id + ":")) delete s.progress[key];
      }
      t.scope = ref.scope;
    }
  }
  return s;
}

function migrate(s) {
  if (s.version === 2) return normaliseScopes(s);
  const fresh = defaultState();
  fresh.characters = Array.isArray(s.characters) ? s.characters : [];
  fresh.resetHour = s.resetHour ?? fresh.resetHour;
  fresh.resetDay = s.resetDay ?? fresh.resetDay;
  fresh.bibleName = s.bibleName || "";
  fresh.bibleRegion = s.bibleRegion || "CE";
  return fresh;
}

function save() {
  if (!configured()) return;
  syncStatus = "saving";
  renderAccount();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const res = await api("/api/state", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state),
      });
      syncStatus = res.ok ? "saved" : "error";
      if (!res.ok) toast("Save failed (" + res.status + ")");
    } catch (err) {
      syncStatus = "error";
      toast("Save failed — offline?");
    }
    renderAccount();
  }, 600);
}

/* ---------- roster import ---------- */

async function importRoster() {
  if (!configured()) { toast("Set the API URL and key on Setup first"); return; }
  const name = (state.bibleName || "").trim();
  if (!name) { toast("Enter a character name to import from"); return; }

  toast("Importing…");
  let body;
  try {
    const res = await api("/api/roster?name=" + encodeURIComponent(name) +
      "&region=" + encodeURIComponent(state.bibleRegion));
    body = await res.json();
    if (!res.ok) { toast(body.error || "Import failed (" + res.status + ")"); return; }
  } catch (err) { toast("Could not reach the API"); return; }

  let added = 0, updated = 0;
  for (const inc of body.characters) {
    const existing = state.characters.find((c) => c.name.toLowerCase() === inc.name.toLowerCase());
    if (existing) {
      if (String(existing.ilvl) !== String(inc.ilvl)) updated++;
      existing.ilvl = inc.ilvl;
    } else {
      state.characters.push({ id: uid(), name: inc.name, cls: "", ilvl: inc.ilvl, countsGold: false });
      added++;
    }
  }
  state.characters.sort((a, b) => (Number(b.ilvl) || 0) - (Number(a.ilvl) || 0));
  save();
  render();
  toast(added + " added, " + updated + " updated");
}

/* ---------- task presets ---------- */

function addTasks(predicate, label) {
  let added = 0;
  for (const c of TASK_CATALOGUE) {
    if (!predicate(c)) continue;
    if (state.tasks.some((t) => t.name === c.name)) continue;
    state.tasks.push({
      id: uid(), name: c.name, icon: c.icon, freq: c.freq, scope: c.scope,
      reps: c.reps, min: c.min, max: c.max, gold: 0, tracked: true,
    });
    added++;
  }
  // Deliberately not re-sorted: new tasks go on the end so a hand-arranged
  // order survives adding more.
  save();
  render();
  toast(added ? added + " " + label + " added" : "Already added");
}

// The initial ordering only — dailies first, then weeklies, character-scope
// before roster-scope, then by unlock level. Applied once at seed time; after
// that the array order is whatever you have dragged it into.
function orderTasks() {
  const freqRank = { daily: 0, weekly: 1, biweekly: 2 };
  state.tasks.sort((a, b) =>
    (freqRank[a.freq] - freqRank[b.freq]) ||
    (a.scope === b.scope ? 0 : a.scope === "character" ? -1 : 1) ||
    (a.min - b.min) ||
    a.name.localeCompare(b.name));
}

/* ---------- rendering ---------- */

function render() {
  document.querySelectorAll("#tabs button").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.tab === activeTab));
  });
  renderAccount();
  const banner = configured() ? "" :
    '<div class="panel" style="border-color:var(--gold)"><h2>Not connected</h2>' +
    '<p class="hint" style="margin:0">Tracker data lives in the Worker\'s database. ' +
    "Add the API URL and key on the Setup tab to load it.</p></div>";
  document.getElementById("view").innerHTML = banner + ({
    checklist: renderChecklist, dashboard: renderDashboard, history: renderHistory,
    roster: renderRoster, setup: renderSetup,
  }[activeTab])();
}

function renderAccount() {
  const el = document.getElementById("account");
  const text = { unconfigured: "Not connected — see Setup", saving: "Saving…",
                 saved: "Saved", error: "Sync error", idle: "" }[syncStatus];
  const colour = syncStatus === "error" ? "var(--danger)"
    : syncStatus === "saved" ? "var(--teal)" : "var(--muted)";
  el.innerHTML = '<span style="color:' + colour + '">' + esc(text) + "</span>";
}

const SECTIONS = [
  { freq: "daily", scope: "character", label: "Daily Character" },
  { freq: "daily", scope: "roster", label: "Daily Roster" },
  { freq: "weekly", scope: "character", label: "Weekly Character" },
  { freq: "biweekly", scope: "character", label: "Biweekly Character" },
  { freq: "weekly", scope: "roster", label: "Weekly Roster" },
];

function taskLabel(t) {
  // The whole label cell is the drag handle; the grip just advertises it.
  return '<th class="task-col" draggable="true" data-drag-task="' + t.id + '">' +
    '<span class="grip" title="Drag to reorder">⠿</span>' +
    (t.icon ? '<img src="' + ICON_BASE + esc(t.icon) + '" alt="" loading="lazy">' : "") +
    esc(t.name) + "</th>";
}

// "—" means the character's item level puts the task out of range; "·" means
// you switched it off for that character. Different reasons, different marks.
function cellFor(t, ch) {
  if (!applies(t, ch)) return '<td class="na"><span>—</span></td>';
  if (!enabledFor(t, ch)) return '<td class="na"><span title="Not tracked for this character">·</span></td>';
  const n = progressOf(t.id, ch.id);
  const done = n >= t.reps;
  const coin = Number(t.gold) > 0 ? '<span class="coin">🪙</span>' : "";
  return '<td class="cell-td' + (done ? " done" : "") + '">' +
    '<button class="cell' + (done ? " complete" : "") + '" data-task="' + t.id +
    '" data-char="' + ch.id + '" title="Click to advance, right-click to step back">' +
    coin + n + " / " + t.reps + "</button>" +
    (done ? '<span class="carry">C</span>' : "") + "</td>";
}

function renderChecklist() {
  if (!state.characters.length) {
    return '<div class="panel"><p class="empty">No characters yet — import your roster on the Roster tab.</p></div>';
  }
  if (!state.tasks.length) {
    return '<div class="panel"><p class="empty">No tasks yet — add some on the Setup tab.</p></div>';
  }

  const chars = state.characters;
  let html = '<div class="panel"><div class="grid-wrap"><table class="grid"><thead><tr>' +
    '<th class="task-col">Task</th>';
  for (const c of chars) {
    html += '<th class="char-col">' + esc(c.name) +
      ' <span class="ilvl">[' + esc(c.ilvl || "?") + "]</span>" +
      (c.countsGold ? ' <span class="gold-flag" title="Counts toward gold">✓</span>' : "") + "</th>";
  }
  html += "</tr></thead><tbody>";

  for (const sec of SECTIONS) {
    const tasks = state.tasks.filter((t) =>
      t.freq === sec.freq && t.scope === sec.scope && isTracked(t) &&
      // Hide a row entirely when no character runs it — otherwise the grid
      // fills with rows of dashes for content nobody is at the level for.
      (t.scope === "roster" || chars.some((c) => enabledFor(t, c))));
    if (!tasks.length) continue;
    const key = sec.freq + "|" + sec.scope;
    const shut = !!state.collapsed[key];
    html += '<tr class="section"><th colspan="' + (chars.length + 1) + '"' +
      ' data-section="' + key + '" title="Click to ' + (shut ? "show" : "hide") + ' this section">' +
      '<span class="eye' + (shut ? " off" : "") + '"></span>' + sec.label +
      (shut ? ' <span class="muted">(' + tasks.length + " hidden)</span>" : "") + "</th></tr>";
    if (shut) continue;

    const tint = sec.freq !== "daily" ? " tint-weekly" : "";
    for (const t of tasks) {
      html += '<tr class="' + tint.trim() + '">' + taskLabel(t);
      if (t.scope === "roster") {
        // One shared counter for the whole account, spanning every column.
        const n = progressOf(t.id, ROSTER);
        const done = n >= t.reps;
        html += '<td class="roster-td" colspan="' + chars.length + '">' +
          '<button class="cell roster' + (done ? " complete" : "") + '" data-task="' + t.id +
          '" data-char="' + ROSTER + '" title="Click to advance, right-click to step back">' +
          n + " / " + t.reps + "</button></td>";
      } else {
        for (const c of chars) html += cellFor(t, c);
      }
      html += "</tr>";
    }
  }
  html += "</tbody></table></div></div>";
  return html;
}

function renderDashboard() {
  const { earned, potential } = goldTotals();
  const { done, total, pct } = completion();
  const goldPct = potential ? Math.round((earned / potential) * 100) : 0;

  let html = '<div class="cards">' +
    '<div class="card"><div class="label">Weekly gold</div><div class="value gold">' +
      earned.toLocaleString() + '</div><div class="sub">of ' + potential.toLocaleString() +
      " potential · " + goldPct + '%</div><div class="bar gold"><i style="width:' + goldPct + '%"></i></div></div>' +
    '<div class="card"><div class="label">Completion</div><div class="value teal">' + pct +
      '%</div><div class="sub">' + done + " of " + total + ' done</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="card"><div class="label">Daily reset</div><div class="value">' +
      untilText(nextBoundary("daily")) + '</div><div class="sub">every day at ' + state.resetHour + ":00</div></div>" +
    '<div class="card"><div class="label">Weekly reset</div><div class="value">' +
      untilText(nextBoundary("weekly")) + '</div><div class="sub">' + DAYS[state.resetDay] +
      " at " + state.resetHour + ":00</div></div></div>";

  html += '<div class="panel"><h2>Still outstanding today</h2>';
  const outstanding = [];
  for (const ch of state.characters) {
    const left = state.tasks.filter((t) => t.freq === "daily" && t.scope === "character" &&
      applies(t, ch) && progressOf(t.id, ch.id) < t.reps);
    if (left.length) outstanding.push({ who: ch.name, what: left.map((t) => t.name).join(", ") });
  }
  if (!state.characters.length) html += '<p class="empty">No characters yet.</p>';
  else if (!outstanding.length) html += '<p class="empty">Everything done. Nice.</p>';
  else {
    html += '<table class="plain">';
    for (const o of outstanding) {
      html += "<tr><td><strong>" + esc(o.who) + '</strong></td><td class="muted">' + esc(o.what) + "</td></tr>";
    }
    html += "</table>";
  }
  html += "</div>";

  html += '<div class="panel"><h2>Gold by character</h2>';
  const gc = goldChars();
  if (!gc.length) html += '<p class="empty">No characters are marked as counting gold — set that on the Roster tab.</p>';
  else {
    html += '<table class="plain"><tr><th>Character</th><th class="num">Gold</th></tr>';
    for (const ch of gc) {
      let sum = 0;
      for (const t of state.tasks) {
        if (t.scope === "roster" || !applies(t, ch)) continue;
        sum += (Number(t.gold) || 0) * progressOf(t.id, ch.id);
      }
      html += "<tr><td>" + esc(ch.name) + '</td><td class="num" style="color:var(--gold)">' +
        sum.toLocaleString() + "</td></tr>";
    }
    html += "</table>";
  }
  return html + "</div>";
}

function renderHistory() {
  const hist = state.history || [];
  const current = goldTotals().earned;
  const banked = hist.reduce((sum, h) => sum + h.gold, 0);
  const weeks = hist.length;
  const avg = weeks ? Math.round(banked / weeks) : 0;
  const best = weeks ? Math.max(...hist.map((h) => h.gold)) : 0;

  let html = '<div class="cards">' +
    '<div class="card"><div class="label">Accumulated gold</div><div class="value gold">' +
      (banked + current).toLocaleString() + '</div><div class="sub">' + banked.toLocaleString() +
      " banked + " + current.toLocaleString() + " this week</div></div>" +
    '<div class="card"><div class="label">Weeks recorded</div><div class="value">' + weeks + "</div>" +
      '<div class="sub">banked at each weekly reset</div></div>' +
    '<div class="card"><div class="label">Weekly average</div><div class="value teal">' +
      avg.toLocaleString() + '</div><div class="sub">across recorded weeks</div></div>' +
    '<div class="card"><div class="label">Best week</div><div class="value gold">' +
      best.toLocaleString() + "</div></div></div>";

  if (!weeks) {
    return html + '<div class="panel"><h2>History</h2><p class="empty">Nothing banked yet. ' +
      "Each weekly reset files that week's gold here automatically — the first entry appears after " +
      DAYS[state.resetDay] + "'s reset.</p></div>";
  }

  const recent = hist.slice(-16);
  const peak = Math.max(...recent.map((h) => h.gold), 1);
  html += '<div class="panel"><h2>Gold per week</h2><div class="chart">';
  for (const h of recent) {
    const pct = Math.round((h.gold / peak) * 100);
    html += '<div class="col" title="' + h.gold.toLocaleString() + ' gold">' +
      '<div class="track"><i style="height:' + pct + '%"></i></div>' +
      "<small>" + weekLabel(h.end) + "</small></div>";
  }
  html += "</div></div>";

  html += '<div class="panel"><h2>Week by week</h2><table class="plain">' +
    '<tr><th>Week ending</th><th class="num">Gold</th><th class="num">Running total</th></tr>';
  let running = 0;
  for (const h of hist) {
    running += h.gold;
    html += "<tr><td>" + fullDate(h.end) + '</td><td class="num" style="color:var(--gold)">' +
      h.gold.toLocaleString() + '</td><td class="num muted">' + running.toLocaleString() + "</td></tr>";
  }
  return html + "</table></div>";
}

const weekLabel = (epoch) => {
  const d = new Date(epoch * 1000);
  return (d.getMonth() + 1) + "/" + d.getDate();
};
const fullDate = (epoch) => new Date(epoch * 1000).toLocaleDateString();

function renderRoster() {
  let html = '<div class="panel"><h2>Import from lostark.bible</h2>' +
    '<p class="hint">Pulls every character on the roster this character belongs to and refreshes item ' +
    "levels. Matching is by name, so classes, gold flags and progress are kept. Class isn't imported — " +
    "lostark.bible renders it as an unlabelled icon.</p><div class=\"add-row\">" +
    '<input type="text" id="bible-name" class="grow" placeholder="Any character on your roster" value="' +
      esc(state.bibleName || "") + '">' +
    '<select id="bible-region"><option value="CE"' + (state.bibleRegion === "CE" ? " selected" : "") +
      ">Central Europe</option><option value=\"NA\"" + (state.bibleRegion === "NA" ? " selected" : "") +
      ">North America</option></select>" +
    '<button class="btn primary" id="import-roster">Refresh roster</button></div></div>';

  html += '<div class="panel"><h2>Characters</h2>' +
    '<p class="hint">"Counts gold" marks the characters whose rewards feed the gold totals. ' +
    "Raids are picked per character below; dailies and weeklies are tracked once for the whole roster.</p>";
  if (!state.characters.length) html += '<p class="empty">No characters yet.</p>';
  else {
    for (const c of state.characters) {
      const eligible = state.tasks.filter((t) => isTracked(t) && t.scope === "character" && applies(t, c));
      const on = eligible.filter((t) => enabledFor(t, c)).length;

      html += '<div class="row" data-char="' + c.id + '">' +
        '<input type="text" class="grow" value="' + esc(c.name) + '" data-field="name" placeholder="Name">' +
        '<input type="text" value="' + esc(c.cls || "") + '" data-field="cls" placeholder="Class" style="width:140px">' +
        '<input type="text" value="' + esc(c.ilvl || "") + '" data-field="ilvl" placeholder="Item level" style="width:100px">' +
        '<label class="muted"><input type="checkbox" data-field="countsGold"' +
          (c.countsGold ? " checked" : "") + "> counts gold</label>" +
        '<button class="btn danger" data-remove-char="' + c.id + '">Remove</button></div>';

      html += '<details class="char-tasks" data-char-tasks="' + c.id + '"' +
        (openCharPanels.has(c.id) ? " open" : "") + "><summary>" +
        on + " of " + eligible.length + " raids tracked for " + esc(c.name) + "</summary>";

      if (!eligible.length) {
        html += '<p class="empty">No raids match this character\'s item level yet.</p>';
      } else {
        html += '<div class="add-row" style="margin:0 0 8px">' +
          '<button class="btn" data-char-all="' + c.id + '">Select all</button>' +
          '<button class="btn" data-char-none="' + c.id + '">Select none</button></div>';
        for (const sec of SECTIONS) {
          const inSec = eligible.filter((t) => t.freq === sec.freq && t.scope === sec.scope);
          if (!inSec.length) continue;
          html += '<div class="task-group"><h3>' + sec.label + "</h3>";
          for (const t of inSec) {
            html += '<label class="task-pick"><input type="checkbox" data-pick-task="' + t.id +
              '" data-pick-char="' + c.id + '"' + (enabledFor(t, c) ? " checked" : "") + "> " +
              (t.icon ? '<img src="' + ICON_BASE + esc(t.icon) + '" alt="">' : "") +
              esc(t.name) + '<span class="muted"> ·' + t.min + "</span></label>";
          }
          html += "</div>";
        }
      }
      html += "</details>";
    }
  }
  return html + '<div class="add-row"><input type="text" id="new-char" class="grow" placeholder="Character name">' +
    '<button class="btn primary" id="add-char">Add character</button></div></div>';
}

function renderSetup() {
  const icons = [...new Set(TASK_CATALOGUE.map((c) => c.icon))].sort();

  let html = '<div class="panel"><h2>Add tasks</h2>' +
    '<p class="hint">Names, icons, repetition counts and item-level ranges come from ' +
    "lostark-helper's task manager. Gold is 0 on everything — set it per task below, since gold " +
    "rewards change with patches.</p><div class=\"add-row\">" +
    '<button class="btn primary" id="add-endgame">Add endgame raids (ilvl 1680+)</button>' +
    '<button class="btn" id="add-all">Add everything</button></div></div>';

  html += '<div class="panel"><h2>Custom task</h2>' +
    '<p class="hint">For anything the catalogue doesn\'t cover — an event, a personal goal, ' +
    "a shop you want to remember. Roster scope gives one counter for the whole account; " +
    "character scope gives one per character, subject to the item-level range.</p>" +
    '<div class="add-row">' +
      '<input type="text" id="ct-name" class="grow" placeholder="Task name" style="min-width:200px">' +
      '<select id="ct-icon" title="Icon">' +
        icons.map((i) => '<option value="' + esc(i) + '">' + esc(i.replace(/\.(webp|png)$/, "")) + "</option>").join("") +
      "</select>" +
      '<select id="ct-freq" title="Frequency"><option value="daily">Daily</option>' +
        '<option value="weekly" selected>Weekly</option><option value="biweekly">Biweekly</option></select>' +
      '<select id="ct-scope" title="Scope"><option value="character">Character</option>' +
        '<option value="roster" selected>Roster</option></select>' +
    "</div><div class=\"add-row\">" +
      '<label class="muted">Repetitions <input type="number" id="ct-reps" min="1" max="99" value="1" style="width:70px"></label>' +
      '<label class="muted">Min ilvl <input type="number" id="ct-min" min="0" value="0" style="width:90px"></label>' +
      '<label class="muted">Max ilvl <input type="number" id="ct-max" min="0" value="9999" style="width:90px"></label>' +
      '<label class="muted">Gold each <input type="number" id="ct-gold" min="0" value="0" style="width:90px"></label>' +
      '<button class="btn primary" id="add-custom">Add task</button>' +
    "</div></div>";

  html += '<div class="panel"><h2>Tasks</h2>';
  if (!state.tasks.length) html += '<p class="empty">No tasks yet.</p>';
  else {
    html += '<table class="plain"><tr><th>Tracked</th><th>Task</th><th>Frequency</th><th>Scope</th>' +
      '<th class="num">Reps</th><th class="num">Min ilvl</th><th class="num">Gold each</th><th></th></tr>';
    for (const t of state.tasks) {
      html += '<tr data-task-row="' + t.id + '">' +
        '<td><input type="checkbox" data-field="tracked"' + (isTracked(t) ? " checked" : "") +
        ' title="Untick to hide this task from the grid entirely"></td><td' +
        (isTracked(t) ? "" : ' class="muted"') + ">" +
        (t.icon ? '<img src="' + ICON_BASE + esc(t.icon) + '" alt="" style="width:16px;height:16px;vertical-align:-3px;margin-right:6px">' : "") +
        esc(t.name) + '</td><td class="muted">' + esc(t.freq) + '</td><td class="muted">' + esc(t.scope) +
        '</td><td class="num muted">' + t.reps + '</td><td class="num muted">' + t.min + "</td>" +
        '<td class="num"><input type="number" min="0" value="' + (t.gold || 0) +
          '" data-field="gold" style="width:90px"></td>' +
        '<td class="num"><button class="btn danger" data-remove-task="' + t.id + '">Remove</button></td></tr>';
    }
    html += "</table>";
  }
  html += "</div>";

  html += '<div class="panel"><h2>Resets</h2><p class="hint">Uses this device\'s local time. ' +
    "Progress clears automatically when a boundary passes, and the week's gold is filed into History first.</p>" +
    '<div class="row"><label class="grow">Daily reset hour <input type="number" id="reset-hour" min="0" max="23" value="' +
      state.resetHour + '" style="width:70px"></label>' +
    '<label class="grow">Weekly reset day <select id="reset-day">' +
      DAYS.map((d, i) => '<option value="' + i + '"' + (i === state.resetDay ? " selected" : "") + ">" + d + "</option>").join("") +
    "</select></label></div>" +
    '<div class="add-row"><button class="btn" id="reset-daily">Reset dailies now</button>' +
    '<button class="btn" id="reset-weekly">Reset weeklies now</button></div></div>';

  html += '<div class="panel"><h2>Connection</h2>' +
    '<p class="hint">All tracker data lives in the Worker\'s database, not on this machine. ' +
    "Only the URL and key below are stored in this browser.</p>" +
    '<div class="add-row"><input type="text" id="api-url" class="grow" placeholder="https://losttracker-api.<subdomain>.workers.dev" value="' +
      esc(apiBase()) + '"></div>' +
    '<div class="add-row"><input type="password" id="api-key" class="grow" placeholder="APP_KEY" value="' +
      esc(apiKey()) + '"><button class="btn primary" id="save-api">Save &amp; reload</button></div></div>';

  return html + '<div class="panel"><h2>Backup</h2>' +
    '<div class="add-row"><button class="btn" id="export">Export JSON</button>' +
    '<button class="btn" id="import">Import JSON</button></div></div>';
}

/* ---------- events ---------- */

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  activeTab = btn.dataset.tab;
  render();
});

const view = document.getElementById("view");

function bumpCell(btn, delta) {
  const t = state.tasks.find((x) => x.id === btn.dataset.task);
  if (!t) return;
  const key = t.id + ":" + btn.dataset.char;
  const current = state.progress[key] || 0;
  // Advancing past the last repetition wraps back to zero, so a mis-click is
  // one more click to undo rather than a trip to another tab.
  let next = current + delta;
  if (next > t.reps) next = 0;
  if (next < 0) next = t.reps;
  if (next === 0) delete state.progress[key];
  else state.progress[key] = next;

  const isRoster = btn.dataset.char === ROSTER;
  const done = next >= t.reps;
  const coin = Number(t.gold) > 0 && !isRoster ? '<span class="coin">🪙</span>' : "";
  btn.innerHTML = coin + next + " / " + t.reps;
  btn.className = "cell" + (isRoster ? " roster" : "") + (done ? " complete" : "");

  // Keep the carry marker in step without re-rendering the whole grid, which
  // would lose the horizontal scroll position on a wide roster.
  const td = btn.parentElement;
  td.classList.toggle("done", done && !isRoster);
  const existing = td.querySelector(".carry");
  if (done && !existing && !isRoster) {
    const mark = document.createElement("span");
    mark.className = "carry";
    mark.textContent = "C";
    td.appendChild(mark);
  } else if (!done && existing) {
    existing.remove();
  }
  save();
}

view.addEventListener("click", (e) => {
  const t = e.target;
  const cell = t.closest("button.cell");
  if (cell) { bumpCell(cell, 1); return; }

  const band = t.closest("tr.section th[data-section]");
  if (band) {
    const key = band.dataset.section;
    if (state.collapsed[key]) delete state.collapsed[key];
    else state.collapsed[key] = true;
    save(); render(); return;
  }

  if (t.id === "add-endgame") { addTasks((c) => c.min >= 1680, "endgame raids"); return; }
  if (t.id === "add-all") { addTasks(() => true, "tasks"); return; }

  if (t.id === "add-custom") {
    const name = document.getElementById("ct-name").value.trim();
    if (!name) { toast("Give the task a name"); return; }
    if (state.tasks.some((x) => x.name.toLowerCase() === name.toLowerCase())) {
      toast("A task with that name already exists");
      return;
    }
    const num = (id, fallback) => {
      const v = parseInt(document.getElementById(id).value, 10);
      return Number.isFinite(v) ? v : fallback;
    };
    const min = Math.max(0, num("ct-min", 0));
    const max = Math.max(min, num("ct-max", 9999));
    state.tasks.push({
      id: uid(),
      name,
      icon: document.getElementById("ct-icon").value,
      freq: document.getElementById("ct-freq").value,
      scope: document.getElementById("ct-scope").value,
      reps: Math.min(99, Math.max(1, num("ct-reps", 1))),
      min, max,
      gold: Math.max(0, num("ct-gold", 0)),
      tracked: true,
      custom: true,
    });
    save();
    render();
    toast('Added "' + name + '"');
    return;
  }

  if (t.dataset.removeTask) {
    const id = t.dataset.removeTask;
    state.tasks = state.tasks.filter((x) => x.id !== id);
    for (const key of Object.keys(state.progress)) {
      if (key.startsWith(id + ":")) delete state.progress[key];
    }
    save(); render(); return;
  }

  if (t.id === "import-roster") { importRoster(); return; }

  if (t.dataset.charAll || t.dataset.charNone) {
    const charId = t.dataset.charAll || t.dataset.charNone;
    const ch = state.characters.find((c) => c.id === charId);
    const on = !!t.dataset.charAll;
    for (const task of state.tasks) {
      if (task.scope !== "character" || !isTracked(task) || !applies(task, ch)) continue;
      setCharTask(charId, task.id, on);
    }
    openCharPanels.add(charId);
    save(); render(); return;
  }

  const summary = t.closest("details.char-tasks > summary");
  if (summary) {
    // <details> toggles itself; just remember the state for the next render.
    const id = summary.parentElement.dataset.charTasks;
    if (summary.parentElement.open) openCharPanels.delete(id);
    else openCharPanels.add(id);
    return;
  }

  if (t.id === "add-char") {
    const input = document.getElementById("new-char");
    const name = input.value.trim();
    if (!name) return;
    state.characters.push({ id: uid(), name, cls: "", ilvl: "", countsGold: false });
    save(); render(); return;
  }
  if (t.dataset.removeChar) {
    const id = t.dataset.removeChar;
    state.characters = state.characters.filter((c) => c.id !== id);
    for (const key of Object.keys(state.progress)) {
      if (key.endsWith(":" + id)) delete state.progress[key];
    }
    save(); render(); return;
  }

  if (t.id === "reset-daily") { clearFreq("daily"); save(); render(); toast("Dailies cleared"); return; }
  if (t.id === "reset-weekly") { clearFreq("weekly"); clearFreq("biweekly"); save(); render(); toast("Weeklies cleared"); return; }

  if (t.id === "save-api") {
    const url = document.getElementById("api-url").value.trim().replace(/\/+$/, "");
    const key = document.getElementById("api-key").value.trim();
    if (url) store.set(LS_API, url); else store.remove(LS_API);
    if (key) store.set(LS_KEY, key); else store.remove(LS_KEY);
    toast("Saved — reloading");
    setTimeout(() => window.location.reload(), 600);
    return;
  }
  if (t.id === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "losttracker-backup.json";
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }
  if (t.id === "import") {
    const picker = document.createElement("input");
    picker.type = "file";
    picker.accept = "application/json";
    picker.onchange = async () => {
      const file = picker.files[0];
      if (!file) return;
      try {
        state = migrate({ ...defaultState(), ...JSON.parse(await file.text()) });
        applyResets(); save(); render(); toast("Imported");
      } catch (err) { toast("That file isn't valid LostTracker JSON"); }
    };
    picker.click();
  }
});

/* ---------- drag to reorder ---------- */

let dragTaskId = null;

const sameSection = (a, b) => a && b && a.freq === b.freq && a.scope === b.scope;

view.addEventListener("dragstart", (e) => {
  const handle = e.target.closest("[data-drag-task]");
  if (!handle) return;
  dragTaskId = handle.dataset.dragTask;
  handle.closest("tr").classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  // Firefox refuses to start a drag unless some data is set.
  e.dataTransfer.setData("text/plain", dragTaskId);
});

view.addEventListener("dragover", (e) => {
  if (!dragTaskId) return;
  const handle = e.target.closest("[data-drag-task]");
  if (!handle || handle.dataset.dragTask === dragTaskId) return;

  // Rows are grouped into sections when rendered, so moving a task between
  // sections could not show up. Only offer a drop inside its own section.
  const dragged = state.tasks.find((t) => t.id === dragTaskId);
  const target = state.tasks.find((t) => t.id === handle.dataset.dragTask);
  if (!sameSection(dragged, target)) return;

  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".drop-above, .drop-below").forEach((el) =>
    el.classList.remove("drop-above", "drop-below"));
  const box = handle.getBoundingClientRect();
  const below = e.clientY > box.top + box.height / 2;
  handle.classList.add(below ? "drop-below" : "drop-above");
});

view.addEventListener("drop", (e) => {
  if (!dragTaskId) return;
  const handle = e.target.closest("[data-drag-task]");
  if (!handle) return;
  e.preventDefault();

  const targetId = handle.dataset.dragTask;
  const dragged = state.tasks.find((t) => t.id === dragTaskId);
  const target = state.tasks.find((t) => t.id === targetId);
  if (!sameSection(dragged, target) || dragTaskId === targetId) return;

  const box = handle.getBoundingClientRect();
  const after = e.clientY > box.top + box.height / 2;

  const from = state.tasks.findIndex((t) => t.id === dragTaskId);
  state.tasks.splice(from, 1);
  // Recompute the target index after the removal, or the item lands one slot
  // off whenever it was dragged downwards.
  const to = state.tasks.findIndex((t) => t.id === targetId);
  state.tasks.splice(after ? to + 1 : to, 0, dragged);

  dragTaskId = null;
  save();
  render();
});

view.addEventListener("dragend", () => {
  dragTaskId = null;
  document.querySelectorAll(".dragging").forEach((el) => el.classList.remove("dragging"));
  document.querySelectorAll(".drop-above, .drop-below").forEach((el) =>
    el.classList.remove("drop-above", "drop-below"));
});

// Right-click steps a counter back instead of opening the browser menu.
view.addEventListener("contextmenu", (e) => {
  const cell = e.target.closest("button.cell");
  if (!cell) return;
  e.preventDefault();
  bumpCell(cell, -1);
});

view.addEventListener("change", (e) => {
  const t = e.target;

  if (t.id === "bible-name") { state.bibleName = t.value.trim(); save(); return; }
  if (t.id === "bible-region") { state.bibleRegion = t.value; save(); return; }

  if (t.id === "reset-hour") {
    state.resetHour = Math.min(23, Math.max(0, parseInt(t.value, 10) || 0));
    state.lastDaily = lastDailyBoundary(state.resetHour);
    state.lastWeekly = lastWeeklyBoundary(state.resetDay, state.resetHour);
    save(); render(); return;
  }
  if (t.id === "reset-day") {
    state.resetDay = parseInt(t.value, 10);
    state.lastWeekly = lastWeeklyBoundary(state.resetDay, state.resetHour);
    save(); render(); return;
  }

  if (t.dataset.pickTask) {
    setCharTask(t.dataset.pickChar, t.dataset.pickTask, t.checked);
    save();
    // Re-render so the summary count and the grid both catch up, keeping this
    // character's panel open.
    openCharPanels.add(t.dataset.pickChar);
    render();
    return;
  }

  const taskRow = t.closest("[data-task-row]");
  if (taskRow && t.dataset.field === "gold") {
    const task = state.tasks.find((x) => x.id === taskRow.dataset.taskRow);
    if (task) task.gold = Math.max(0, parseInt(t.value, 10) || 0);
    save(); return;
  }
  if (taskRow && t.dataset.field === "tracked") {
    const task = state.tasks.find((x) => x.id === taskRow.dataset.taskRow);
    if (task) task.tracked = t.checked;
    save(); render(); return;
  }

  const charRow = t.closest("[data-char]");
  if (charRow && t.dataset.field) {
    const c = state.characters.find((x) => x.id === charRow.dataset.char);
    if (c) c[t.dataset.field] = t.dataset.field === "countsGold" ? t.checked : t.value;
    save();
    if (t.dataset.field === "ilvl" || t.dataset.field === "countsGold") render();
  }
});

/* ---------- boot ---------- */

(async function init() {
  await loadState();

  // Seed the whole catalogue once, so everything is present to pick from
  // rather than needing to be added first. The flag means clearing the list
  // deliberately is respected instead of being undone on the next load.
  if (!state.seeded && !state.tasks.length) {
    for (const c of TASK_CATALOGUE) {
      state.tasks.push({
        id: uid(), name: c.name, icon: c.icon, freq: c.freq, scope: c.scope,
        reps: c.reps, min: c.min, max: c.max, gold: 0, tracked: true,
      });
    }
    orderTasks();
    state.seeded = true;
    save();
  }

  if (!state.lastDaily) state.lastDaily = lastDailyBoundary(state.resetHour);
  if (!state.lastWeekly) state.lastWeekly = lastWeeklyBoundary(state.resetDay, state.resetHour);
  if (applyResets()) save();
  render();

  setInterval(() => {
    if (applyResets()) { save(); render(); toast("Reset applied"); }
    else if (activeTab === "dashboard" || activeTab === "history") render();
  }, 60000);
})();
</script>
</body>
</html>
