name = "losttracker-api"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "losttracker-db"
database_id = "55ddd07a-8180-42f2-ae61-b39c0e4096be"

[vars]
# Comma-separated allowlist of origins the frontend is served from. Each must
# match the browser's Origin header exactly (scheme + host, no trailing slash).
# "null" is what a page opened directly off disk (file://) sends — keep it while
# you run index.html locally, drop it once the app is served over HTTP.
APP_ORIGIN = "https://losttracker.github.io,null"

# Secret, set out of band and never committed:
#   npx wrangler secret put APP_KEY
