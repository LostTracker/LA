name = "losttracker-api"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "losttracker-db"
database_id = "55ddd07a-8180-42f2-ae61-b39c0e4096be"

[vars]
# Origin the frontend is served from. Must match exactly (scheme + host, no
# trailing slash) or the browser rejects the CORS response.
APP_ORIGIN = "https://losttracker.github.io"

# Secret, set out of band and never committed. This is the only thing standing
# between the internet and your tracker, so make it long and random:
#   npx wrangler secret put APP_KEY
